# Vale configuration for the documentation review (see ../README.md).
# The review runs Vale only on .rst files changed in a pull request and
# reports only the lines the pull request adds or changes.

StylesPath = styles
MinAlertLevel = suggestion

# Fixtures for the review's own tests use .rst.txt so Sphinx never builds them.
[formats]
txt = rst

[*.{rst,txt}]
BasedOnStyles = Omnia

# Rules turned off for whole files or folders are listed under "suppress" in ../settings.yml.
