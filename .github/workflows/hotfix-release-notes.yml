name: Hotfix Release Notes

on:
  schedule:
    - cron: "15 10 * * *"
      timezone: "Europe/Stockholm"

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  copilot-requests: write

jobs:
  detect-release:
    name: Detect approved release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OmniaDocsG2
        uses: actions/checkout@v6

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Detect release waiting for release notes
        id: detect-release
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN_HOTFIX_RELEASE_NOTES_WF }}
        run: bash .github/scripts/detect-release.sh

      - name: Retrieve release issues
        if: steps.detect-release.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN_HOTFIX_RELEASE_NOTES_WF }}
        run: bash .github/scripts/get-release-issues.sh      
        
      - name: Generate release notes
        if: steps.detect-release.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/generate-release-notes.sh

      - name: Create pull request for release notes
        if: steps.detect-release.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_NOTES_FILE: release-notes/7.0/versions.rst
        run: bash .github/scripts/create-pr.sh


      - name: Show trigger information
        run: |
          echo "Release notes automation started"
          echo "Triggered by: ${{ github.event_name }}"
          date
