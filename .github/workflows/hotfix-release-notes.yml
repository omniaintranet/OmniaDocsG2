name: Hotfix Release Notes

on:
  schedule:
    - cron: "15 10 * * *"
      timezone: "Europe/Stockholm"

  workflow_dispatch:

jobs:
  detect-release:
    name: Detect approved release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OmniaDocsG2
        uses: actions/checkout@v6

      - name: Detect release waiting for release notes
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN_HOTFIX_RELEASE_NOTES_WF }}
        run: bash .github/scripts/detect-release.sh

      - name: Retrieve release issues
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN_HOTFIX_RELEASE_NOTES_WF }}
        run: bash .github/scripts/get-release-issues.sh

      - name: Generate release notes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6
        run: bash .github/scripts/generate-release-notes.sh

      - name: Show trigger information
        run: |
          echo "Release notes automation started"
          echo "Triggered by: ${{ github.event_name }}"
          date