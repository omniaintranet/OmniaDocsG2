name: Hotfix Release Notes

on:
  schedule:
    - cron: "15 10 * * *"
      timezone: "Europe/Stockholm"

  workflow_dispatch:

jobs:
  detect-release:
    name: Detect approved release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OmniaDocsG2
        uses: actions/checkout@v6

      - name: List organization projects
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN_HOTFIX_RELEASE_NOTES_WF }}
        run: |
          gh api graphql -f query='
            query {
              organization(login: "omniaintranet") {
                projectsV2(first: 20) {
                  nodes {
                    id
                    number
                    title
                  }
                }
              }
            }
          '

      - name: Show trigger information
        run: |
          echo "Release notes automation started"
          echo "Triggered by: ${{ github.event_name }}"
          date