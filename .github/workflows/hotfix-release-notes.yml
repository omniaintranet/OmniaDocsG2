name: Hotfix Release Notes

on:
  schedule:
    - cron: "0 10 * * *"
      timezone: "Europe/Stockholm"

  workflow_dispatch:
    inputs:
      release_status:
        description: Exact project status to process when multiple releases are waiting
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  copilot-requests: write

concurrency:
  group: hotfix-release-notes
  cancel-in-progress: false

jobs:
  detect-release:
    name: Detect approved release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout OmniaDocsG2
        uses: actions/checkout@v6

      - name: Detect release waiting for release notes
        id: detect-release
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN_HOTFIX_RELEASE_NOTES_WF }}
          RELEASE_STATUS: ${{ inputs.release_status }}
        run: bash .github/scripts/hotfix-release-notes/detect-release.sh

      - name: Retrieve release issues
        if: steps.detect-release.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN_HOTFIX_RELEASE_NOTES_WF }}
        run: bash .github/scripts/hotfix-release-notes/get-release-issues.sh

      - name: Install GitHub Copilot CLI
        if: steps.detect-release.outputs.found == 'true'
        run: npm install -g @github/copilot

      # Before generation: the prompt includes the review rules (docs_review.py --prompt-rules).
      - name: Set up Python for the documentation review
        if: steps.detect-release.outputs.found == 'true'
        continue-on-error: true
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install documentation review tools
        if: steps.detect-release.outputs.found == 'true'
        # Without the tools the notes are generated without the rules and the review reports
        # that it could not finish; the PR still opens.
        continue-on-error: true
        run: |
          python -m pip install -r docs/requirements.txt -r .github/docs-review/requirements.txt
          bash .github/scripts/docs-review/install-tools.sh

      - name: Generate release notes
        id: generate-release-notes
        if: steps.detect-release.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/hotfix-release-notes/generate-release-notes.sh

      - name: Upload Copilot response after generation failure
        if: failure() && steps.generate-release-notes.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: copilot-release-notes-response-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/copilot-release-notes-response.txt
          if-no-files-found: error
          retention-days: 1

      # The same rules as the pull request check (.github/docs-review/README.md). Copilot rewords
      # bullets with audience and tone findings (a bounded number of times). The pull request
      # opened with github.token does not start docs-review.yml, so the result goes into its body.
      # Findings do not stop the run: people review the draft before it is marked ready.
      - name: Review generated release notes
        id: review-release-notes
        if: steps.detect-release.outputs.found == 'true' && steps.generate-release-notes.outputs.has_notes == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_NOTES_FILE: release-notes/7.0/versions.rst
        run: bash .github/scripts/hotfix-release-notes/review-release-notes.sh

      - name: Create pull request for release notes
        id: create-release-pr
        if: steps.detect-release.outputs.found == 'true' && steps.generate-release-notes.outputs.has_notes == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_NOTES_FILE: release-notes/7.0/versions.rst
        run: bash .github/scripts/hotfix-release-notes/create-pr.sh

      - name: Create release-ready issue in Project 8
        if: success() && steps.detect-release.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN_HOTFIX_RELEASE_NOTES_WF }}
          DOCUMENTATION_PR_URL: ${{ steps.create-release-pr.outputs.pr_url }}
          RELEASE_NOTES_URL: https://omnia-docs-g2.readthedocs.io/en/latest/release-notes/7.0/versions.html
        run: bash .github/scripts/hotfix-release-notes/create-ready-project-item.sh

      - name: Show trigger information
        if: always()
        run: |
          echo "Release notes automation started"
          echo "Triggered by: ${{ github.event_name }}"
          date
