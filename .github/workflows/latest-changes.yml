name: Documentation updates

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: Europe/Copenhagen
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  copilot-requests: write

concurrency:
  group: latest-documentation-changes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install classification, documentation and review tools
        run: |
          npm install -g @github/copilot@1.0.96
          python -m pip install -r docs/requirements.txt -r .github/docs-review/requirements.txt
          bash .github/scripts/docs-review/install-tools.sh
      - name: Test digest generation
        run: python -m unittest discover -s .github/scripts/latest-changes -p 'test_*.py'
      - name: Update reader digest
        id: digest
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          DOCS_BRANCH: ${{ github.event.repository.default_branch }}
        run: python .github/scripts/latest-changes/update.py
      - name: Report backfill progress
        env:
          REMAINING_GROUPS: ${{ steps.digest.outputs.remaining_groups }}
        run: echo "Page/date groups remaining after this run = $REMAINING_GROUPS"
      # The same rules as the pull request check (.github/docs-review/README.md), on the
      # lines this run changed. Copilot rewords entries with audience and tone findings
      # (a bounded number of times); what is left is reported and does not block.
      # A confidentiality finding (secrets included) fails the run before "Publish digest":
      # nothing is committed, state.json is not advanced, and the next run classifies
      # the same changes again. Findings are in the job summary.
      - name: Review the digest before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/latest-changes/update.py --review "$RUNNER_TEMP/docs-review"
      - name: Build documentation and verify digest links
        run: |
          python -m sphinx -b html . _build/html
          python .github/scripts/latest-changes/update.py --check-build _build/html
      - name: Publish digest
        env:
          DOCS_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add documentation-updates/index.rst .github/scripts/latest-changes/state.json
          if git diff --cached --quiet; then
            echo "No digest changes."
            exit 0
          fi
          git commit -m "Refresh documentation updates"
          # A concurrent edit causes a safe failure; the next run retries from
          # the unchanged persisted state. Never force-push documentation.
          git push origin "HEAD:refs/heads/$DOCS_BRANCH"
